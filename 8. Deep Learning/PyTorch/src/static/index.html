<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/styles.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%231e1e1e'/%3E%3Ctext x='32' y='44' font-family='sans-serif' font-size='40' font-weight='700' text-anchor='middle' fill='%234a90e2'%3Ef;%3C/text%3E%3C/svg%3E">
<title>fashion;</title></head>
<body>
<header><a href="/" class="name">fashion;</a></header>
<main><div class="page page-enter">
  <h1>Fashion-MNIST Classifier</h1>
  <p class="muted">Upload a clothing image and the CNN guesses one of 10 classes.</p>
  <div class="stats">
    <div class="stat good"><b>91.85%</b><span>test accuracy</span></div>
    <div class="stat"><b>10</b><span>classes</span></div>
    <div class="stat"><b>ONNX</b><span>CPU runtime</span></div>
  </div>
  <div class="project-tile">
    <label class="drop" id="drop">
      <input type="file" id="file" accept="image/*">
      <img id="preview" class="hidden" alt="preview">
      <b id="hint">Drop an image here or click to choose</b>
      <span class="muted" id="sub">PNG / JPG, converted to 28×28 grayscale</span>
    </label>
    <div class="actions">
      <button id="go" disabled>Predict</button>
      <button id="reset" class="ghost hidden">Clear</button>
    </div>
    <p class="error hidden" id="err"></p>
  </div>
  <div id="result" class="hidden">
    <div class="group">Result</div>
    <div class="project-tile">
      <div class="result-top"><h2 id="label"></h2><span class="pill good" id="conf"></span></div>
      <div class="bars" id="bars"></div>
    </div>
  </div>
  <p class="muted" style="margin-top:24px">API: <a href="/docs">/docs</a> · <a href="/health">/health</a> · <a href="/classes">/classes</a></p>
</div></main>
<footer><p>&copy; 2026 alfi; made with 💛</p></footer>
<script>
const $=id=>document.getElementById(id);
let file=null;
function setFile(f){
  if(!f)return; file=f;
  $('preview').src=URL.createObjectURL(f);$('preview').classList.remove('hidden');
  $('hint').textContent=f.name;$('sub').textContent='Ready to predict';
  $('go').disabled=false;$('reset').classList.remove('hidden');$('err').classList.add('hidden');
}
$('file').onchange=e=>setFile(e.target.files[0]);
['dragover','dragenter'].forEach(t=>$('drop').addEventListener(t,e=>{e.preventDefault();$('drop').classList.add('over')}));
['dragleave','drop'].forEach(t=>$('drop').addEventListener(t,e=>{e.preventDefault();$('drop').classList.remove('over')}));
$('drop').addEventListener('drop',e=>setFile(e.dataTransfer.files[0]));
$('reset').onclick=()=>{file=null;$('file').value='';$('preview').classList.add('hidden');
  $('hint').textContent='Drop an image here or click to choose';$('sub').textContent='PNG / JPG, converted to 28×28 grayscale';
  $('go').disabled=true;$('reset').classList.add('hidden');$('result').classList.add('hidden');$('err').classList.add('hidden');};
$('go').onclick=async()=>{
  $('go').disabled=true;$('go').textContent='Predicting…';$('err').classList.add('hidden');
  try{
    const fd=new FormData();fd.append('file',file);
    const r=await fetch('/predict',{method:'POST',body:fd});
    const d=await r.json();
    if(!r.ok)throw new Error(d.detail||'Request failed');
    $('label').textContent=d.label;$('conf').textContent=(d.confidence*100).toFixed(2)+'%';
    $('bars').innerHTML=Object.entries(d.probabilities).sort((a,b)=>b[1]-a[1]).map(([n,p],i)=>
      `<div class="bar ${i?'':'top'}"><span>${n}</span><div class="track"><div class="fill" style="width:${(p*100).toFixed(2)}%"></div></div><em>${(p*100).toFixed(1)}%</em></div>`).join('');
    $('result').classList.remove('hidden');
  }catch(e){$('err').textContent=e.message;$('err').classList.remove('hidden');}
  $('go').disabled=false;$('go').textContent='Predict';
};
</script></body></html>
